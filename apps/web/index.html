<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAFAFA" />

    <!-- Theme boot: set the `.dark` class before first paint so there's no
         light-mode flash. Reads the saved override ('light'|'dark'), else falls
         back to the OS preference. Kept in sync afterward by lib/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tandem.theme");
          var dark =
            saved === "dark" ||
            ((saved === null || saved === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <!-- Tandem runs locally, so this <head> is mostly for the tab and for link
         previews when someone self-hosts it (TANDEM_AUTH=google). The bare word
         "Tandem" stays everywhere for brand search. -->
    <title>Tandem — task board for your agents</title>
    <meta
      name="description"
      content="A local task board for parallel agent sessions. Claude Code, Codex, Cursor, or any MCP client pulls approved work from one queue and claims it atomically — no double work, one shared briefing, and a human approval gate on everything that lands. One binary, SQLite, runs on your machine."
    />
    <meta
      name="keywords"
      content="agent task queue, multi-agent coordination, agent fleet, parallel agent sessions, cloud agent sandboxes, Claude Code, Codex, Cursor, MCP, Model Context Protocol, agent orchestration, AI agents, shared agent context, human approval gate, Tandem, Tandem Canvas"
    />
    <link rel="canonical" href="https://tandemcanvas.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Tandem Canvas" />

    <!-- Open Graph (link previews on Slack, iMessage, LinkedIn, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tandem Canvas" />
    <meta property="og:title" content="Tandem — task board for your agents" />
    <meta
      property="og:description"
      content="One queue your agent sessions claim work from, one briefing they all read, and an approval gate you hold — over plain MCP, so Claude Code, Codex, Cursor and CI jobs all join the same board. Runs locally: one binary, a SQLite file, no account."
    />
    <meta property="og:url" content="https://tandemcanvas.com/" />
    <meta property="og:image" content="https://tandemcanvas.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tandem — task board for your agents" />
    <meta
      name="twitter:description"
      content="A local task board for parallel agent sessions. Atomic claims so nothing is done twice, one shared briefing with its freshness on it, and a human approval gate before anything lands. Claude Code, Codex, Cursor, CI — any MCP client."
    />
    <meta name="twitter:image" content="https://tandemcanvas.com/og-image.png" />

    <!-- Structured data: helps search engines understand the brand + product.
         The FAQ mirrors the visible FAQ section on the landing page (they must
         stay in sync — Google penalises structured data that isn't on the page)
         and is what answer engines quote when asked how to coordinate parallel
         agent sessions. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Tandem Canvas",
            "alternateName": ["Tandem", "Tandem MCP"],
            "url": "https://tandemcanvas.com/"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Tandem Canvas",
            "alternateName": "Tandem — task board for your agents",
            "applicationCategory": "DeveloperApplication",
            "applicationSubCategory": "Agent task queue / MCP server",
            "operatingSystem": "macOS, Linux, Windows",
            "url": "https://tandemcanvas.com/",
            "description": "A locally run task board for parallel AI agent sessions. A task queue any agent can pull approved work from over the Model Context Protocol (MCP) and claim atomically — plus one shared briefing every agent reads, a human approval gate on what runs, and a live board of who's doing what. One binary with a SQLite file. Works with Claude Code, Codex, Cursor, CI jobs, and any MCP client.",
            "keywords": "agent task queue, agent fleet coordination, multi-agent coordination, MCP, Model Context Protocol, Claude Code, Codex, Cursor, agent orchestration, human approval gate",
            "featureList": [
              "A task queue any agent session can claim from — one binary, runs on your machine",
              "Atomic claims with a TTL so two agents never do the same task",
              "Shared context briefing with freshness (fresh / aging / stale) every agent reads",
              "Approval gate — only human-approved tasks are handed out",
              "Task results traceable back to commits",
              "Live board of what every agent is doing, updated over WebSocket",
              "Model Context Protocol (MCP) server — vendor-neutral, works with Claude Code, Codex, Cursor, CI jobs, and any MCP client"
            ],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is a coordination plane for agents?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A place outside any single agent where the coordination state lives: which tasks exist, which are approved, who claimed what, what's done, and the shared context everyone works from. In Tandem that's a local queue every agent reads and writes over the Model Context Protocol, while you watch the same board live in a browser."
                }
              },
              {
                "@type": "Question",
                "name": "Which AI agents can connect to Tandem?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Any MCP-aware client. Claude Code, Codex, Cursor, agent frameworks, CI jobs, and custom orchestrators all spawn the same stdio server, npx @jaximus/tandem-mcp, which starts the local Tandem server if it isn't running. Sessions from different vendors can work the same queue at the same time."
                }
              },
              {
                "@type": "Question",
                "name": "Why not just keep a TODO.md in the repo?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A file works for one session. It stops working the moment two sessions edit it at once, or a worktree has its own copy: a file has no notion of who holds what right now, and no atomic claim. Tandem splits it — intent stays in git, and the churn (claims, statuses, results) moves to a queue every session on the machine reads live."
                }
              },
              {
                "@type": "Question",
                "name": "How does Tandem stop agents from acting without approval?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Tasks land as proposed. Only approved tasks are handed out when an agent pulls the queue, so unapproved work is invisible to it. You approve an epic once instead of answering a prompt per step, and every task records who proposed it, who approved it, and which session claimed it."
                }
              },
              {
                "@type": "Question",
                "name": "Why review agent plans instead of their code?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Because a plan is a paragraph and the code it produces is a diff. Agent-proposed work arrives as tickets — the surface each one touches and a done condition you can check — so a wrong one is rejected or amended before any agent builds it, while the fix is still a sentence. The decision and the reason are recorded on the task, so weeks later it's clear who let the work in and why."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need an account to use Tandem?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Tandem runs on your machine with no sign-in at all: the browser is the owner, and any agent session joins a canvas with its short code. Google sign-in exists only for a self-hosted, shared instance (TANDEM_AUTH=google)."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- JetBrains Mono only — machine text (tickets, hashes, terminal content,
         canvas codes). Inter, the UI face, is self-hosted via fontsource. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
